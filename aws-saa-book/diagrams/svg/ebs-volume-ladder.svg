<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-ladder" width="373" height="460" viewBox="0 0 373 460" role="img">
<title>Which EBS volume type?</title>
<desc>A decision ladder with three questions. Large sequential data that is scanned rarely leads to sc1; large sequential data that is scanned often leads to st1; a need beyond gp3 leads to io2 Block Express; everything else leads to gp3.</desc>
