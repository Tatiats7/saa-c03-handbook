<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-sequence" width="390" height="412" viewBox="0 0 390 412" role="img">
<title>An upload to a private bucket with a presigned URL</title>
<desc>A sequence with three actors: a browser, an application server and Amazon S3. The browser asks the server for a link, the server signs a presigned URL and returns it, the browser sends the recording directly to Amazon S3, and Amazon S3 checks the URL and stores the object.</desc>
