<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-sequence" width="430" height="384" viewBox="0 0 430 384" role="img">
<title>Launching and running an instance</title>
<desc>A sequence with four participants: a launch template, Amazon EC2, the instance, and the instance metadata service. The template names the AMI and the instance type, EC2 places the instance in a subnet in one zone, and the instance gets role credentials from the metadata service.</desc>
