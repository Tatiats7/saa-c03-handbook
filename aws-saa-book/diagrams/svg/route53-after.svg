<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="300" height="546" viewBox="0 0 300 546" role="img">
<title>Callvale after: alias records in a Route 53 hosted zone</title>
<desc>After: the registrar lists the four name servers of a Route 53 public hosted zone. Alias records for callvale.example and app.callvale.example point to CloudFront, which sends requests to the Application Load Balancer. A health check watches the site and alarms through Amazon SNS.</desc>
