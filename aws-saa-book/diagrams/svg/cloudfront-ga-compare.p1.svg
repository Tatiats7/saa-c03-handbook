<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="300" height="340" viewBox="0 0 300 340" role="img">
<title>CloudFront and Global Accelerator side by side: CloudFront</title>
<desc>Two panels. Left, CloudFront: users reach an edge location with cached copies; a miss goes to the origin. Right, Global Accelerator: users reach two static anycast addresses; traffic crosses the AWS global network to load balancers in two Regions.</desc>
