<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-sequence" width="324" height="328" viewBox="0 0 324 328" role="img">
<title>Envelope encryption with AWS KMS</title>
<desc>Three actors: an application, AWS KMS and a data store. The application gets a data key from AWS KMS, stores encrypted data with the encrypted key, and later asks AWS KMS to decrypt the key.</desc>
