<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="362" height="478" viewBox="0 0 362 478" role="img">
<title>Callvale after: a data volume and daily snapshots</title>
<desc>After: the same instance in the default VPC has a root volume for the operating system and temporary files and a separate encrypted gp3 data volume for the database. A Data Lifecycle Manager policy takes a daily snapshot of the data volume into Amazon S3 and deletes old snapshots.</desc>
