<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="142" height="308" viewBox="0 0 142 308" role="img">
<title>Three ways to invoke a function: Synchronous</title>
<desc>Three panels. In the first, API Gateway calls the function and waits for the response. In the second, Amazon S3 hands an event to Lambda&#x27;s internal queue and gets a success response at once. In the third, Lambda polls an SQS queue and invokes the function with a batch.</desc>
