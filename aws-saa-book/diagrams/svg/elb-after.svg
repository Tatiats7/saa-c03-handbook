<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="367" height="534" viewBox="0 0 367 534" role="img">
<title>Callvale after: an Application Load Balancer in three zones</title>
<desc>After: users connect over HTTPS to an Application Load Balancer in public subnets in AZ 1, AZ 2 and AZ 3. It forwards requests to one web instance in a private subnet in each zone. The instance in AZ 2 is marked unhealthy and gets no requests.</desc>
