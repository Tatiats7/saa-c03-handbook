<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="336" height="520" viewBox="0 0 336 520" role="img">
<title>A VPC with public and private subnets</title>
<desc>A VPC in one Region with an internet gateway. A public subnet holds a web instance and a NAT gateway. A private subnet holds a worker instance. Users reach the web instance through the internet gateway. The worker&#x27;s requests go to the NAT gateway, then out through the internet gateway.</desc>
