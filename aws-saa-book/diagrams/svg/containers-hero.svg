<title>One request through an ECS service on Fargate</title>
<desc>A VPC with private subnets in two Availability Zones. An Application Load Balancer sends requests to the Fargate tasks of one ECS service. The tasks pull their image from Amazon ECR and write to Amazon S3.</desc>
