<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-sequence" width="328" height="400" viewBox="0 0 328 400" role="img">
<title>A download with a presigned URL</title>
<desc>A sequence with three actors: a user, an app server and Amazon S3. The user asks the app server for a file. The app server signs a URL and returns it. The user sends a GET request with the presigned URL to Amazon S3, and Amazon S3 returns the object to the user.</desc>
