<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="324" height="518" viewBox="0 0 324 518" role="img">
<title>Callvale before: one application on one Auto Scaling group</title>
<desc>Before: users reach an Application Load Balancer that sends every request to one application on the web Auto Scaling group in three Availability Zones. Conversion workers run in a second group.</desc>
