<title>Callvale at demo day</title>
<desc>One instance in one Availability Zone runs the web application, the worker and the database; a public bucket holds the audio. Markers show six of the review&#x27;s findings: the root user&#x27;s access key in the code, the public bucket, an open database port, SSH open to the world, one volume and no backups.</desc>
