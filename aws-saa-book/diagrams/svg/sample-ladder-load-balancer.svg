<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-ladder" width="365" height="454" viewBox="0 0 365 454" role="img">
<title>Which load balancer?</title>
<desc>A decision ladder with three questions. If traffic must pass through virtual appliances, choose a Gateway Load Balancer. If not, and requests are routed by HTTP path or host, choose an Application Load Balancer. If not, and the traffic is TCP, UDP or TLS, choose a Network Load Balancer. Otherwise read the requirement again.</desc>
