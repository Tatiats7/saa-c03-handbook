<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-sequence" width="390" height="440" viewBox="0 0 390 440" role="img">
<title>One request through IAM</title>
<desc>A sequence with three participants: a principal, AWS STS and Amazon S3. The principal asks AWS STS to assume a role. AWS STS checks the trust policy and returns temporary credentials. The principal signs a request to Amazon S3 with them. AWS evaluates the policies, and Amazon S3 returns the object or an access denied error.</desc>
