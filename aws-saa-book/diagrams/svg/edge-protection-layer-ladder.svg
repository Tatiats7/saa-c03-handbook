<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-ladder" width="388" height="522" viewBox="0 0 388 522" role="img">
<title>Which service stops which threat</title>
<desc>A ladder of four questions. A flood of packets: AWS Shield. Harmful content or too many requests in web traffic: AWS WAF. Traffic that enters or leaves a VPC and needs domain or protocol rules: AWS Network Firewall. The same rules in every account: AWS Firewall Manager.</desc>
