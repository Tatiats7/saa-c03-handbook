<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-states" width="300" height="518" viewBox="0 0 300 518" role="img">
<title>The life of an instance in a group</title>
<desc>A state diagram with seven states. Pending leads to InService, or first to Pending:Wait when a launch hook exists. InService can move to Standby and back. InService leads to Terminating, then to Terminated, or first to Terminating:Wait when a termination hook exists.</desc>
