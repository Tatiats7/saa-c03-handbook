<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-ladder" width="365" height="428" viewBox="0 0 365 428" role="img">
<title>How do you pay for an instance?</title>
<desc>A decision ladder with three questions. Licenses bound to sockets or cores lead to Dedicated Hosts; work that can stop and restart leads to Spot Instances; steady use for one or three years leads to a Savings Plan; everything else leads to On-Demand.</desc>
