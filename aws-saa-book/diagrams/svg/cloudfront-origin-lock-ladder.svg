<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-ladder" width="393" height="406" viewBox="0 0 393 406" role="img">
<title>How does the origin accept only CloudFront?</title>
<desc>A decision ladder. An S3 bucket through its REST endpoint leads to origin access control. A load balancer or instance that can be private leads to a VPC origin. An internet-facing load balancer leads to a prefix list and a custom header. Anything else leads to custom headers or origin mutual TLS.</desc>
