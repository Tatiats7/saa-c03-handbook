<text class="dg-el" x="235" y="83.5">done</text>
<text class="dg-el" x="154.5" y="22" text-anchor="middle">start</text>
<text class="dg-el" x="77" y="166.5">terminate</text>
<text class="dg-el" x="77" y="258.5">done</text>
</svg>
