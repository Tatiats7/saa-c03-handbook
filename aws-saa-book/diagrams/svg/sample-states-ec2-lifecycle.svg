<text class="dg-nl" x="71" y="33.5">pending</text>
<rect class="dg-ground" x="35" y="97" width="72" height="48" rx="24"/>
<rect class="dg-sp" x="35" y="97" width="72" height="48" rx="24"/>
<text class="dg-nl" x="71" y="125.5">running</text>
<rect class="dg-nb" x="191.2" y="97" width="75.6" height="48" rx="24"/>
