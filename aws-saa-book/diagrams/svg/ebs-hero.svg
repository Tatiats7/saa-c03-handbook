<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-sequence" width="393" height="512" viewBox="0 0 393 512" role="img">
<title>A write, a copy in the zone and a snapshot</title>
<desc>A sequence with three participants: an EC2 instance, an EBS volume and Amazon S3. The instance writes blocks to the volume in its zone, EBS copies the volume inside that zone, a snapshot sends the changed blocks to Amazon S3, and a new volume is restored from it in another zone.</desc>
