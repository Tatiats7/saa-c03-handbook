<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-states" width="300" height="242" viewBox="0 0 300 242" role="img">
<title>The versioning states of a bucket</title>
<desc>A state diagram with three states: unversioned, versioning-enabled and versioning-suspended. Enable leads from unversioned to enabled; suspend leads from enabled to suspended; enable leads back from suspended to enabled. No arrow returns to unversioned.</desc>
