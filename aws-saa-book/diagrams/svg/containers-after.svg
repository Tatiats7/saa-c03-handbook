<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="376" height="518" viewBox="0 0 376 518" role="img">
<title>Callvale after: six ECS services on Fargate</title>
<desc>After: the Application Load Balancer sends requests by path to six ECS services on Fargate in three Availability Zones: dashboard, upload, search, accounts, billing and admin. Each service pulls its image from Amazon ECR. Conversion workers stay on EC2.</desc>
