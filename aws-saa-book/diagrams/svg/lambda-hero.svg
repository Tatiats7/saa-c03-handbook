<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-sequence" width="416" height="412" viewBox="0 0 416 412" role="img">
<title>One event through AWS Lambda</title>
<desc>A sequence with four participants: an event source, the Lambda service, a warm execution environment and a new execution environment. Two events arrive together. The first goes to the warm environment; for the second, Lambda starts a new environment and runs its initialization first.</desc>
