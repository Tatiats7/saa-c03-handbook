<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-sequence" width="377" height="504" viewBox="0 0 377 504" role="img">
<title>A request through CloudFront</title>
<desc>A sequence with four participants: a viewer, an edge location, a regional edge cache and the origin. The viewer&#x27;s request reaches the edge location, which has no copy. The edge location asks the regional edge cache, which also has no copy, and that cache asks the origin. The object travels back through both caches to the viewer, and both caches keep a copy.</desc>
