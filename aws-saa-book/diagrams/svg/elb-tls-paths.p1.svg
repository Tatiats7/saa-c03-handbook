<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="142" height="324" viewBox="0 0 142 324" role="img">
<title>Where TLS ends: Terminate at the ALB</title>
<desc>Three panels. In the first, the client sends HTTPS to an Application Load Balancer, which sends plain HTTP to the instance. In the second, the load balancer sends HTTPS to the instance. In the third, a Network Load Balancer with a TCP listener passes the encrypted traffic to the instance, which decrypts it.</desc>
