<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="384" height="518" viewBox="0 0 384 518" role="img">
<title>One file system, a mount target in each zone</title>
<desc>Two Availability Zones in one Region. In each zone, an instance connects to the EFS mount target of its own zone. Both mount targets lead to one Amazon EFS file system, which stores the data across the zones.</desc>
