<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-timeline" width="388" height="220" viewBox="0 0 388 220" role="img">
<title>One object under an S3 Lifecycle rule</title>
<desc>A timeline of object age with four marks: the day the object is created, then a later day, a much later day and a last day. The lifecycle rule sets the day numbers. From creation to the first mark the object is in S3 Standard and usual access is frequent. At the first mark a transition moves the object to S3 Standard-IA, and usual access is infrequent. At the second mark a second transition moves the object to S3 Glacier Flexible Retrieval, and usual access is rare. On the last day the object expires.</desc>
<style>.dg{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}.dg-ground{fill:#FFFFFF}.dg-g{fill:none;stroke-linejoin:round}.dg-g-region{stroke:#00838A;stroke-width:1.5;stroke-dasharray:1.5 4.5;stroke-linecap:round}.dg-g-vpc{stroke:#8C4FFF;stroke-width:2}.dg-g-az{stroke:#00838A;stroke-width:1.25;stroke-dasharray:9 5}.dg-g-pub{stroke:#5B8A0F;stroke-width:1.25;fill:#5B8A0F;fill-opacity:.07}.dg-g-priv{stroke:#00838A;stroke-width:1.25;stroke-dasharray:10 3 2 3;fill:#00838A;fill-opacity:.07}.dg-g-sg{stroke:#DD344C;stroke-width:1.25;stroke-dasharray:4 3}.dg-g-asg{stroke:#C75B00;stroke-width:1.25;stroke-dasharray:8 3 2 3 2 3}.dg-g-acct{stroke:#C2136B;stroke-width:1.25;stroke-dasharray:14 3 5 3}.dg-g-dc{stroke:#5A667A;stroke-width:1.25;stroke-dasharray:18 4;fill:#5A667A;fill-opacity:.07}.dg-g-gen{stroke:#5A667A;stroke-width:1.25;stroke-dasharray:3 5}.dg-gl{font-size:11.5px;fill:#141C2B}.dg-nl{font-size:13px;fill:#141C2B;text-anchor:middle}.dg-nb{fill:#F2F4F8;stroke:#4A5568;stroke-width:1.25}.dg-ne{fill:#2A3EB1;fill-opacity:.08;stroke:#2A3EB1;stroke-width:2}.dg-e{fill:none;stroke:#4A5568;stroke-width:1.5;stroke-linejoin:round}.dg-e-emph{stroke:#2A3EB1;stroke-width:2.25}.dg-e-dash{stroke-dasharray:5 4}.dg-ah{fill:#4A5568}.dg-ah-emph{fill:#2A3EB1}.dg-el{font-size:12px;fill:#141C2B}.dg-el-emph{fill:#2A3EB1}.dg-b{fill:#4A5568}.dg-b-emph{fill:#2A3EB1}.dg-bt{font-size:11px;font-weight:700;fill:#FFFFFF;text-anchor:middle}.dg-ll{fill:none;stroke:#5A667A;stroke-width:1;stroke-dasharray:2 4}.dg-nt{fill:#F2F4F8;stroke:#5A667A;stroke-width:1;stroke-dasharray:3 3}.dg-nf{fill:none;stroke:#4A5568;stroke-width:1.25}.dg-sp{fill:#2A3EB1;fill-opacity:.12;stroke:#2A3EB1;stroke-width:2}.dg-ax{fill:none;stroke:#4A5568;stroke-width:1.5}.dg-ev{fill:none;stroke:#2A3EB1;stroke-width:2}.dg-mt{font-size:11.5px;fill:#5A667A}.dg-evl{font-size:12px;font-weight:700;fill:#2A3EB1}.dg-ph{font-size:13px;font-weight:700;fill:#141C2B}</style>
