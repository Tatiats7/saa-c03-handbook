<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-sequence" width="373" height="432" viewBox="0 0 373 432" role="img">
<title>A read and a write through DAX</title>
<desc>A sequence with three participants: an application with the DAX client, the DAX cluster and the DynamoDB table. A read that DAX has cached returns from DAX. A read that DAX has not cached goes on to the table, and DAX keeps the item. A write goes to the table first, then to DAX. A strongly consistent read goes through DAX to the table.</desc>
