<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-ladder" width="381" height="350" viewBox="0 0 381 350" role="img">
<title>Which scaling method?</title>
<desc>A decision ladder with three questions. A known time leads to a scheduled action; a daily or weekly pattern leads to predictive plus dynamic scaling; work in a queue leads to backlog per instance; otherwise target tracking on utilization.</desc>
