<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-ladder" width="377" height="328" viewBox="0 0 377 328" role="img">
<title>Which option survives?</title>
<desc>A decision ladder with three questions that you ask of each option. First: does it break a stated requirement? Yes removes it. Second: does it solve a different problem? Yes removes it. Third: does another working option rank higher on the qualifier? Yes removes it. An option that passes all three questions is the answer.</desc>
