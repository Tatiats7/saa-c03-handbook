<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-compare" width="364" height="308" viewBox="0 0 364 308" role="img">
<title>Deleting an older snapshot</title>
<desc>Two panels. Before: snapshot 1 holds blocks A, B and C, snapshot 2 holds a new block B and points to A and C in snapshot 1, snapshot 3 holds a new block C. After snapshot 1 is deleted: block A stays with snapshot 2, and snapshot 3 still restores the whole volume.</desc>
