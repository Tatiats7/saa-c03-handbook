<rect class="dg-ground" width="364" height="308"/>
<text class="dg-ph" x="5" y="18">Three snapshots</text>
<svg x="5" y="27" width="168" height="242" viewBox="0 0 168 242">
<path class="dg-e dg-e-dash" d="M97 94L97 63.5"/>
