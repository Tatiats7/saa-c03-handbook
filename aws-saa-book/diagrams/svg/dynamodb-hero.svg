<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-sequence" width="391" height="448" viewBox="0 0 391 448" role="img">
<title>One write: from the key to three Availability Zones</title>
<desc>A sequence with four participants: an application, DynamoDB, one partition, and its copies in three Availability Zones. The application sends a write with the item&#x27;s key. DynamoDB hashes the partition key and picks the partition. The partition stores the item in three zones. DynamoDB returns success. A later read is eventually consistent unless it asks for a strong read.</desc>
