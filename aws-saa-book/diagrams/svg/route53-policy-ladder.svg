<rect class="dg-nb" x="5" y="5" width="172" height="48" rx="4"/>
<text class="dg-nl" x="91" y="25.5">Should a standby wait</text>
<text class="dg-nl" x="91" y="41.5">until the main site fails?</text>
<rect class="dg-nb" x="247" y="5" width="133.2" height="48" rx="24"/>
<text class="dg-nl" x="313.6" y="33.5">Failover records</text>
<rect class="dg-nb" x="5" y="95" width="172" height="48" rx="4"/>
<text class="dg-nl" x="91" y="115.5">Must users stay inside a</text>
<text class="dg-nl" x="91" y="131.5">country or area?</text>
<rect class="dg-ground" x="247" y="95" width="133.2" height="48" rx="24"/>
<rect class="dg-sp" x="247" y="95" width="133.2" height="48" rx="24"/>
<text class="dg-nl" x="313.6" y="115.5">Geolocation</text>
<text class="dg-nl" x="313.6" y="131.5">records</text>
<rect class="dg-nb" x="5" y="185" width="172" height="48" rx="4"/>
<text class="dg-nl" x="91" y="205.5">Should each user get the</text>
<text class="dg-nl" x="91" y="221.5">fastest Region?</text>
<rect class="dg-ground" x="247" y="185" width="133.2" height="48" rx="24"/>
<rect class="dg-sp" x="247" y="185" width="133.2" height="48" rx="24"/>
<text class="dg-nl" x="313.6" y="213.5">Latency records</text>
<rect class="dg-nb" x="5" y="275" width="172" height="48" rx="4"/>
<text class="dg-nl" x="91" y="295.5">Should traffic split by</text>
<text class="dg-nl" x="91" y="311.5">fixed shares?</text>
<rect class="dg-nb" x="247" y="275" width="133.2" height="48" rx="24"/>
<text class="dg-nl" x="313.6" y="303.5">Weighted records</text>
<rect class="dg-nb" x="5" y="365" width="172" height="64" rx="4"/>
<text class="dg-nl" x="91" y="385.5">Several healthy</text>
<text class="dg-nl" x="91" y="401.5">addresses without a load</text>
<text class="dg-nl" x="91" y="417.5">balancer?</text>
<rect class="dg-nb" x="247" y="373" width="133.2" height="48" rx="24"/>
<text class="dg-nl" x="313.6" y="393.5">Multivalue answer</text>
<text class="dg-nl" x="313.6" y="409.5">records</text>
