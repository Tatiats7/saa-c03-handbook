<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="436" height="464" viewBox="0 0 436 464" role="img">
<title>A request through an Application Load Balancer</title>
<desc>An architecture with users on the left and an Application Load Balancer with a node in each of two Availability Zones. Each zone has one instance in a private subnet; the instance in the second zone is marked unhealthy. Numbered arrows run from the users to a node and on to the healthy instance.</desc>
