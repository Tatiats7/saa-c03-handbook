<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-ladder" width="353" height="450" viewBox="0 0 353 450" role="img">
<title>Is the request allowed?</title>
<desc>A ladder of four questions. Does any policy explicitly deny the request? Yes ends in an explicit deny. Does an SCP or RCP leave the action out? Does a boundary or session policy leave it out? Is an allow missing from identity-based and resource-based policies? Each of these yes answers ends in an implicit deny. Four answers of no end in allow.</desc>
