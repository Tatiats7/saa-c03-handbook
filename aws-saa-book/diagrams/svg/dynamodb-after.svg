<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="316" height="562" viewBox="0 0 316 562" role="img">
<title>Callvale after: the jobs table in DynamoDB</title>
<desc>After: the S3 upload event starts the start-job function, which starts the state machine call-pipeline. Each step reads and writes the job item by call ID in the DynamoDB table jobs. The dashboard queries the global secondary index by-customer. Time to live removes old job items.</desc>
