<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="158" height="582" viewBox="0 0 158 582" role="img">
<title>Who manages which layer: Amazon S3</title>
<desc>Two stacks, Amazon EC2 and Amazon S3. In both, AWS owns the facilities, hardware and virtualization layer. On EC2 the customer owns the guest operating system, application, security groups and data. On S3 the customer owns the data, encryption choices and IAM permissions.</desc>
