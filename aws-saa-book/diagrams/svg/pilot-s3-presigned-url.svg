<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-sequence" width="328" height="400" viewBox="0 0 328 400" role="img">
<title>An upload with a presigned URL</title>
<desc>A sequence with three actors: an application, a browser and Amazon S3. The browser asks the application for an upload URL. The application signs a URL with the credentials of its IAM role and returns the presigned URL to the browser. The browser sends the file with a PUT request to the presigned URL, directly to Amazon S3. Amazon S3 checks the signature, stores the object and returns a success response. The file does not pass through the application.</desc>
