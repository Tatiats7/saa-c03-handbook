<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="458" height="422" viewBox="0 0 458 422" role="img">
<title>Fan-out from one topic to two queues</title>
<desc>A publisher on the left sends to one SNS topic. Arrows go from the topic to two SQS queues; the arrow to the second queue carries a filter policy label. Each queue has its own consumer on the right, and a dead-letter queue sits under each queue.</desc>
