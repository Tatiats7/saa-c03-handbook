<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="300" height="356" viewBox="0 0 300 356" role="img">
<title>Many key values or one hot key: Many key values</title>
<desc>Two panels. Many key values: requests with different keys go to three partitions in even shares, and all are served. One hot key: almost every request carries the same key and goes to one partition, which throttles, while the other two partitions are nearly idle.</desc>
