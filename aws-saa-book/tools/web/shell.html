<title>SAA-C03 Handbook</title>
{{fonts}}
<style>
{{css}}
</style>
<div id="saa" class="app ts-1" lang="en">
  <a class="skip" href="#saa-main">Skip to content</a>
  <header id="saa-top" class="top">
    <button type="button" id="saa-menu" class="top-menu" data-act="toc" aria-controls="saa-toc" aria-expanded="false">Contents</button>
    <a class="brand" href="#home" aria-label="SAA-C03 Handbook"><span class="brand-s">SAA-C03</span><span class="brand-l"> Handbook</span></a>
    <nav id="saa-nav" class="nav" aria-label="Main">
      <a href="#home" data-nav="home">Today</a>
      <a href="#plan" data-nav="plan">Plan</a>
      <a href="#mistakes" data-nav="practice">Practice</a>
      <a href="#speak" data-nav="speak">Speak</a>
      <a href="#progress" data-nav="progress">Progress</a>
    </nav>
    <button type="button" id="saa-search" class="top-search" data-act="search">Search</button>
  </header>
  <div class="shell">
    <nav id="saa-toc" class="toc" aria-label="Contents" tabindex="-1">{{toc}}</nav>
    <main id="saa-main" tabindex="-1">
      <p id="saa-sync" class="sync" hidden></p>
      <div id="saa-view" data-view="home">{{static}}</div>
    </main>
    <aside id="saa-rail" class="rail" aria-label="On this page" hidden></aside>
  </div>
  <div id="saa-live" class="vh" aria-live="polite"></div>
  <div id="saa-pop-layer" class="pop-layer" hidden><div id="saa-pop" class="pop" role="dialog" tabindex="-1"></div></div>
  <div id="saa-sheet" class="sheet" role="dialog" aria-modal="true" tabindex="-1" hidden></div>
  <div id="saa-toast" class="toast" role="status" hidden></div>
  <svg id="saa-sprite" width="0" height="0" aria-hidden="true"></svg>
</div>
<script type="application/json" id="saa-boot">{{boot}}</script>
