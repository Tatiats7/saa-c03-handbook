<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-arch" width="356" height="578" viewBox="0 0 356 578" role="img">
<title>A three-tier web application</title>
<desc>Users send requests to an Application Load Balancer in public subnets. The load balancer forwards each request to one of two app servers in an Auto Scaling group in private subnets. The app servers use a primary DB instance, which replicates to a standby DB instance.</desc>
<style>.dg{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}.dg-ground{fill:#FFFFFF}.dg-g{fill:none;stroke-linejoin:round}.dg-g-region{stroke:#00838A;stroke-width:1.5;stroke-dasharray:1.5 4.5;stroke-linecap:round}.dg-g-vpc{stroke:#8C4FFF;stroke-width:2}.dg-g-az{stroke:#00838A;stroke-width:1.25;stroke-dasharray:9 5}.dg-g-pub{stroke:#5B8A0F;stroke-width:1.25;fill:#5B8A0F;fill-opacity:.07}.dg-g-priv{stroke:#00838A;stroke-width:1.25;stroke-dasharray:10 3 2 3;fill:#00838A;fill-opacity:.07}.dg-g-sg{stroke:#DD344C;stroke-width:1.25;stroke-dasharray:4 3}.dg-g-asg{stroke:#C75B00;stroke-width:1.25;stroke-dasharray:8 3 2 3 2 3}.dg-g-acct{stroke:#C2136B;stroke-width:1.25;stroke-dasharray:14 3 5 3}.dg-g-dc{stroke:#5A667A;stroke-width:1.25;stroke-dasharray:18 4;fill:#5A667A;fill-opacity:.07}.dg-g-gen{stroke:#5A667A;stroke-width:1.25;stroke-dasharray:3 5}.dg-gl{font-size:11.5px;fill:#141C2B}.dg-nl{font-size:13px;fill:#141C2B;text-anchor:middle}.dg-nb{fill:#F2F4F8;stroke:#4A5568;stroke-width:1.25}.dg-ne{fill:#2A3EB1;fill-opacity:.08;stroke:#2A3EB1;stroke-width:2}.dg-e{fill:none;stroke:#4A5568;stroke-width:1.5;stroke-linejoin:round}.dg-e-emph{stroke:#2A3EB1;stroke-width:2.25}.dg-e-dash{stroke-dasharray:5 4}.dg-ah{fill:#4A5568}.dg-ah-emph{fill:#2A3EB1}.dg-el{font-size:12px;fill:#141C2B}.dg-el-emph{fill:#2A3EB1}.dg-b{fill:#4A5568}.dg-b-emph{fill:#2A3EB1}.dg-bt{font-size:11px;font-weight:700;fill:#FFFFFF;text-anchor:middle}</style>
